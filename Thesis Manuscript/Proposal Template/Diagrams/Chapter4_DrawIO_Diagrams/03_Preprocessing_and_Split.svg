<text x="470.0" y="73.0" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Raw ENNS records and observed FBS</text>
<rect x="300" y="132" width="340" height="76" rx="10" fill="#DDEBFA" stroke="#183153" stroke-width="1.5"/>
<text x="470.0" y="165.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sentinel recoding · drop missing FBS</text>
<text x="470.0" y="184.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Feature engineering + label creation</text>
<rect x="30" y="253" width="380" height="48" rx="10" fill="#FFF0D9" stroke="#183153" stroke-width="1.5"/>
<text x="220.0" y="282.0" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RECORDED V2 FLOW</text>
<rect x="510" y="253" width="400" height="48" rx="10" fill="#DDF4EE" stroke="#183153" stroke-width="1.5"/>
<text x="710.0" y="282.0" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LEAKAGE-SAFE FLOW (RECOMMENDED)</text>
<rect x="30" y="343" width="380" height="80" rx="10" fill="#FFE5E5" stroke="#183153" stroke-width="1.5"/>
<text x="220.0" y="378.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Imputation, IQR, scaling, feature filter</text>
<text x="220.0" y="397.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SMOTE on full preprocessed data</text>
<rect x="510" y="343" width="400" height="80" rx="10" fill="#DDF4EE" stroke="#183153" stroke-width="1.5"/>
<text x="710.0" y="378.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Split original data 70/15/15</text>
<text x="710.0" y="397.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Group-based split if needed</text>
<rect x="30" y="463" width="380" height="80" rx="10" fill="#FFE5E5" stroke="#183153" stroke-width="1.5"/>
<text x="220.0" y="498.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Resplit synthetic + original records</text>
<text x="220.0" y="517.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">70% train · 15% val · 15% test</text>
<rect x="510" y="463" width="400" height="80" rx="10" fill="#DDEBFA" stroke="#183153" stroke-width="1.5"/>
<text x="710.0" y="498.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Fit imputer/IQR/scaler/selection on train</text>
<text x="710.0" y="517.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Apply unchanged to validation and test</text>
<rect x="30" y="585" width="380" height="80" rx="10" fill="#FFE5E5" stroke="#183153" stroke-width="1.5"/>
<text x="220.0" y="620.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RISK: test contamination and synthetic</text>
<text x="220.0" y="639.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">neighbor leakage may inflate scores</text>
<rect x="510" y="585" width="400" height="80" rx="10" fill="#DDF4EE" stroke="#183153" stroke-width="1.5"/>
<text x="710.0" y="620.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SMOTE ONLY within training folds</text>
<text x="710.0" y="639.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Validation/test remain original</text>
<rect x="510" y="703" width="400" height="78" rx="10" fill="#EEE7FA" stroke="#183153" stroke-width="1.5"/>
<text x="710.0" y="737.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Evaluate once on untouched held-out test data</text>
<text x="710.0" y="756.5" fill="#263346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Only after training, tuning and calibration</text>
